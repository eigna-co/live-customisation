<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Live Customisation · The Gift Expert</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffffff'/%3E%3Ctext x='15' y='22' font-family='Arial,sans-serif' font-size='22' font-weight='900' fill='%2329b8df' text-anchor='middle'%3Eg%3C/text%3E%3Cpath d='M7 27 C10 24 13 25.5 16 27 C19 28.5 22 27.5 25 25' stroke='%2329b8df' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --accent: #d4ff3a;
    --accent-text: var(--accent);
    --error: #ff7a66;
  }

  /* style presets */
  .style-neon {
    --bg: #0a0a0a; --surface: #141414; --surface-2: #1a1a1a;
    --fg: #f5f5f0; --fg-dim: #7a7a70; --line: rgba(245,245,240,0.1);
  }
  .style-acid {
    --bg: #070a04; --surface: #0f1408; --surface-2: #151b0e;
    --fg: #eaffcf; --fg-dim: #7a8568; --line: rgba(212,255,58,0.14);
  }
  .style-cream {
    --bg: #f5f2ec; --surface: #fffdf8; --surface-2: #ebe6dd;
    --fg: #1a1a1a; --fg-dim: #6a6a60; --line: rgba(26,26,26,0.12); --accent-text: #08758c; --error: #a32614;
  }
  .style-mono {
    --bg: #fafaf7; --surface: #ffffff; --surface-2: #f0f0ec;
    --fg: #0a0a0a; --fg-dim: #666; --line: rgba(10,10,10,0.15); --accent-text: #08758c; --error: #a32614;
  }

  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: var(--body);
    background: #0d0d0d;
    color: #fff;
    overflow: hidden;
  }

  /* App renders as position:fixed overlay — stage and scale-wrap are decorative only */
  .marginalia { display: none; }

  #stage {
    min-height: 100vh; height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(212,255,58,0.05), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(212,255,58,0.03), transparent 50%),
      #0d0d0d;
  }

  #scale-wrap {
    transform-origin: center center;
    display: flex; align-items: center; justify-content: center;
  }

  #stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }

  .marginalia {
    position: absolute; font-family: var(--mono);
    font-size: 10px; letter-spacing: 1.4px;
    color: rgba(255,255,255,0.22); text-transform: uppercase;
    pointer-events: none; z-index: 1;
  }
  .m-top-left  { top: 24px; left: 24px; }
  .m-top-right { top: 24px; right: 24px; text-align: right; }
  .m-bottom-left  { bottom: 24px; left: 24px; }
  .m-bottom-right { bottom: 24px; right: 24px; text-align: right; }
  .m-bottom-left .big, .m-top-right .big {
    display: block; color: rgba(255,255,255,0.4);
    font-size: 11px; margin-top: 3px;
  }

  @keyframes banner-in {
    from { transform: translateY(-30px) scale(0.94); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .screen { animation: fade-in .35s ease; height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div id="stage">

  <div id="scale-wrap"><div id="root"></div></div>
</div>

<script src="/app.js" defer></script>
</body>
</html>
